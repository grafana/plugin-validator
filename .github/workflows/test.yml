name: Build and Test on pull request

on:
  pull_request:
    branches:
      - main
      - renovate/*

jobs:
  test:
    runs-on: ubuntu-x64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # node is needed for the passes that shell out to npx
      # (reactcompat, plugindocs) and for the MCP server tests.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      # semgrep backs the coderules pass; its tests skip when the binary
      # is missing, so install it to keep them in the run.
      - name: Install semgrep
        run: python3 -m pip install semgrep

      # The plugincheck2 integration tests run the built binary from bin/.
      - name: Build plugincheck2
        run: go build -o bin/linux_amd64/plugincheck2 ./pkg/cmd/plugincheck2

      - name: Run tests
        run: go test ./pkg/...

  test-docker-build:
    runs-on: ubuntu-x64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - id: push-to-dockerhub
        uses: grafana/shared-workflows/actions/build-push-to-dockerhub@f02d5da7ddff4ea32bbe5034c7c70e90d2b9622c # build-push-to-dockerhub/v0.4.1
        with:
          repository: grafana/plugin-validator-cli
          context: .
          tags: |-
            "test-pr"
          push: false
          # Disable the build cache (the action defaults cache-from/to to
          # type=gha): this PR validation build must not seed a shared cache a
          # publishing build could later consume (cache poisoning), and the
          # type=gha backend was failing to import anyway.
          cache-from: ""
          cache-to: ""
